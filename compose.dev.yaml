services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: campus_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campus_hub_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-api:
    build:
      context: ./user-api
    ports:
      - "127.0.0.1:8080:8080"
    environment: &api-environment
      DB_URL: jdbc:postgresql://db:5432/campus_hub
      DB_USERNAME: postgres
      DB_PASSWORD: campus_hub_local
      JWT_SECRET: campus-hub-local-only-secret-change-for-production
    depends_on:
      db:
        condition: service_healthy

  association-api:
    build:
      context: ./association-api
    ports:
      - "127.0.0.1:8081:8081"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy

  event-api:
    build:
      context: ./event-api
    ports:
      - "127.0.0.1:8082:8082"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      association-api:
        condition: service_started

  news-api:
    build:
      context: ./news-api
    ports:
      - "127.0.0.1:8083:8083"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4200:80"    
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - user-api
      - association-api
      - event-api
      - news-api

volumes:
  postgres_data:
  frontend_node_modules: