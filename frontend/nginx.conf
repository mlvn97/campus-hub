server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location /api/users {
        proxy_pass http://user-api:8080;
    }

    location /api/associations {
        proxy_pass http://association-api:8080;
    }

    location /api/events {
        proxy_pass http://event-api:8080;
    }

    location /api/news {
        proxy_pass http://news-api:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}