name: Campus Hub CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # 1. Tests Maven
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
            - user-api
            - association-api
            - event-api
            - news-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campus_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        working-directory: ./${{ matrix.service }}
        run: mvn clean test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/campus_hub_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-secret-key-for-ci-only

  # 2. Build et publication des images Docker
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-api
          - association-api
          - event-api
          - news-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/campus-hub-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/campus-hub-${{ matrix.service }}:${{ github.sha }}

  # 3. Déploiement sur EC2
  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          cd /opt/campus-hub
          IMAGE_TAG=${{ github.sha }} docker compose pull
          IMAGE_TAG=${{ github.sha }} docker compose up -d --remove-orphans"

      - name: Check containers
        run: |
          cd /opt/campus-hub
          docker compose ps