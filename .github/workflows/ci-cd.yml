name: Campus Hub CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # 1. Tests Maven
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-api
          - association-api
          - event-api
          - news-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: mvn -B test

  # 2. Build et publication des images Docker
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-api
          - association-api
          - event-api
          - news-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/campus-hub-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/campus-hub-${{ matrix.service }}:${{ github.sha }}

  # 3. Déploiement sur EC2
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare deployment directory
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /opt/campus-hub"

      - name: Copy Docker Compose
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/campus-hub/docker-compose.yml

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd /opt/campus-hub &&
             IMAGE_TAG=${{ github.sha }} docker compose pull &&
             IMAGE_TAG=${{ github.sha }} docker compose up -d --remove-orphans"
